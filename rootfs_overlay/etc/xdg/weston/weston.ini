# Weston configuration for kiosk mode
#
# Disable screen blanking/DPMS to keep the display always on.
# This is essential for a kiosk system where the screen must remain active.

[core]
idle-time=0

# Rotate the Waveshare 10.1" DSI display to landscape mode.
# The panel's native orientation is portrait (800x1280).
# The vc4-kms-dsi-waveshare-panel-v2 overlay has no rotation parameter,
# so rotation must be done here at the compositor level.
[output]
name=DSI-1
transform=90
